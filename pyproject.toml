[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fossil-course"
version = "0.1.0"
description = "Turn a git repository history into a step-by-step course that rebuilds the project."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
fossil = "fossil.cli:main"

[tool.setuptools]
packages = ["fossil"]
